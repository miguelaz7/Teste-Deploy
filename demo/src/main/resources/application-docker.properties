# Application Docker Profile
# Este ficheiro sobrescreve as configurações para ambiente Docker

# Database (conecta ao container MySQL)
spring.datasource.url=jdbc:mysql://db:3306/tub_pgu
spring.datasource.username=admin
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.csv.realtime.enabled=true
app.csv.realtime.path=/app/data/validacoesBus.csv
app.csv.realtime.poll-ms=3000
app.csv.realtime.initial-delay-ms=5000
app.ingestion.retry.enabled=true
app.ingestion.retry.poll-ms=5000
app.ingestion.retry.interval-ms=30000

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Auth0 (desde .env ou variáveis de sistema)
auth0.domain=${AUTH0_DOMAIN:dev-8mibe6xcqdkkxfaj.us.auth0.com}
auth0.audience=${AUTH0_AUDIENCE:https://dev-8mibe6xcqdkkxfaj.us.auth0.com/api/v2/}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://dev-8mibe6xcqdkkxfaj.us.auth0.com/}

# Logging
logging.level.root=INFO
logging.level.com.example.demo=DEBUG

# Actuator (para healthcheck)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
